[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]


[project]
name = "gfnx"
version = "0.1.0"
dependencies = [
  "jax>=0.11.0,<0.13.0",
  "jaxlib>=0.11.0,<0.13.0",
  "chex",
  "flashbax",
  "numpy>=2.1",
  "jax_tqdm",
  "jaxtyping",
  "networkx",
  "omegaconf",
  "matplotlib"
]
authors = [
  { name="Daniil Tiapkin" },
  { name="Artem Agarkov" },
  { name="Nikita Morozov" },
  { name="Ian Maksimov" },
  { name="Askar Tsyganov" },
  { name="Timofei Gritsaev" },
  { name="Sergey Samsonov" },
]
license = "MIT"
description = "Environments for Generative Flow Networks in JAX"
readme = "README.md"
# <3.15: flashbax needs tensorstore, which has no Python 3.15 wheels yet.
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
baselines = [
  "optax",
  "equinox",
  "flashbax",
  "wandb",
  "orbax-checkpoint",
  # hydra-core 1.3.x crashes at startup on Python 3.14 (argparse rejects its help strings);
  # 1.4.0rc3 (a release candidate) works. Drop the split once 1.4.0 is final.
  "hydra-core>=1.3.2; python_version < '3.14'",
  "hydra-core>=1.4.0rc3; python_version >= '3.14'",
  "jax_tqdm",
  "pillow",
  "jraph"
]
cuda12 = [
  "jax[cuda12]>=0.11.0,<0.13.0",
]
tests = [
  "pytest",
  "equinox"
]

[project.urls]
Homepage = "https://github.com/d-tiapkin/gfnx"
Issues = "https://github.com/d-tiapkin/gfnx/issues"
Documentation = "https://gfnx.readthedocs.io/en/latest/"



[tool.ruff]
preview = true
exclude = [
    ".git",
    "build",
    "__pycache__",
    "algo"
]
line-length = 99
indent-width = 4
target-version = "py312"


[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
ignore = [
    "F722",
    # PEP 695 generics (py312 target): keep the `Generic[...]`/TypeVar style for now.
    "UP046",
    "UP047",
]


[tool.ruff.lint.pydocstyle]
convention = "google"
