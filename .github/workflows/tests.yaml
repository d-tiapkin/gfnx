name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: |
          pip install ruff==0.17.4  # pinned: `preview = true` makes results move between releases
      - name: Run Ruff
        run: |
          ruff check .

  core-import:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import gfnx with core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import gfnx"

  test-environments:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests]
      - name: Run environment tests
        run: |
          pytest tests/environments -v

  test-baselines:
    runs-on: ubuntu-latest
    needs: test-environments

    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[baselines,tests]
      - name: Run baselines tests
        run: |
          pytest tests/baselines/test_subtb_hypergrid.py -v

  smoke-baselines:
    runs-on: ubuntu-latest
    needs: test-environments

    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[baselines,tests]
      - name: Download phylo datasets
        run: bash download_ds.sh
      - name: Run smoke tests
        run: |
          pytest tests/baselines/test_baselines_smoke.py -v
